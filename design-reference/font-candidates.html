<title>Kitsch Font Candidates</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Chango&family=Coiny&family=Fredoka:wght@400;600;700&family=Lilita+One&family=Monoton&family=Nunito:wght@400;800;900&family=Rammetto+One&family=Righteous&family=Shrikhand&family=Sniglet:wght@800&family=Titan+One&family=Varela+Round&display=swap" rel="stylesheet">
<style>
  :root { --bg:#1F1F1F; --raised:#2B2B2B; --yellow:#F8D400; --red:#F80000; --text:#F5F1E6; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Nunito", system-ui, sans-serif; padding:24px 16px 64px; }
  h1 { font-family:"Fredoka"; font-weight:700; color:var(--yellow); margin:0 0 4px; }
  p.lede { margin:0 0 24px; opacity:.8; }
  .ref { display:block; width:min(100%, 640px); height:auto; border-radius:16px; border:4px solid var(--red); margin-bottom:32px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap:16px; }
  .card { background:var(--raised); border-radius:20px; padding:16px 20px 20px; border:3px solid transparent; }
  .card:hover { border-color:var(--red); }
  .name { font-size:14px; letter-spacing:.08em; text-transform:uppercase; opacity:.75; margin-bottom:6px; }
  .name b { color:var(--yellow); font-weight:800; }
  .solid, .outline { font-size:clamp(56px, 12vw, 88px); line-height:1.05; letter-spacing:-0.02em; }
  .solid { color:var(--yellow); }
  .outline { color:transparent; -webkit-text-stroke:0.045em var(--yellow); paint-order:stroke fill; }
  .note { font-size:14px; margin-top:8px; opacity:.85; }
  h2 { font-family:"Fredoka"; color:var(--yellow); margin:40px 0 12px; }
  .body-sample { background:var(--raised); border-radius:20px; padding:16px 20px; margin-bottom:12px; }
  .body-sample p { margin:4px 0 0; font-size:17px; line-height:1.55; }
</style>
</head>

<script>
const display = [
  ["Coiny", "Fat, rounded, slightly squared curves. Closest overall match to the logo's letter shapes."],
  ["Bagel Fat One", "Very heavy and bubbly, tight spacing like the logo."],
  ["Titan One", "Heavy rounded sans, classic 70s poster feel."],
  ["Rammetto One", "Wide, chunky, rounded; strong retro sign look."],
  ["Chango", "Extra fat and wide, funky album cover energy."],
  ["Lilita One", "Rounded and condensed, good for headings in tight spaces."],
  ["Sniglet", "Soft and rounded, lighter and more playful."],
  ["Righteous", "Art deco and 70s geometry, more stylised."],
  ["Shrikhand", "Italic, swashy 70s disco style."],
  ["Monoton", "Multi line neon tube style, echoes the logo's outline."]
];
const grid = document.getElementById("grid");
display.forEach(([font, note], i) => {
  const c = document.createElement("div");
  c.className = "card";
  const ff = `"${font}"` + (font === "Sniglet" ? "; font-weight:800" : "");
  c.innerHTML = `<div class="name"><b>${i + 1}.</b> ${font}</div>
    <div class="solid" style='font-family:${ff}'>kitsch</div>
    <div class="outline" style='font-family:${ff}'>kitsch</div>
    <div class="note">${note}</div>`;
  grid.appendChild(c);
});
const bodies = [["Nunito", 400], ["Fredoka", 400], ["Varela Round", 400]];
const bodyEl = document.getElementById("body");
bodies.forEach(([font, w]) => {
  const d = document.createElement("div");
  d.className = "body-sample";
  d.innerHTML = `<div class="name"><b>${font}</b></div>
    <p style="font-family:'${font}'; font-weight:${w}">Kitsch is a funk band that plays loud, tight grooves with plenty of horns and even more hips. This is placeholder text to show how the bio will read in this font.</p>`;
  bodyEl.appendChild(d);
});
</script>
